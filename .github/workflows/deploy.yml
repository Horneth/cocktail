name: Deploy to Firebase Hosting

# Pushes to main go live; pull requests get their own throwaway preview URL.
# (Preview channels replace the old "publish v2 side-by-side under /cocktail/v2/"
# hack — a branch can now be tried on a phone without touching the live site.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      # Needed so the action can comment the preview URL on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Playwright is a devDependency for scripts/smoke.mjs, which no CI job
          # runs. Skipping its postinstall keeps a ~100 MB browser download out
          # of every `npm ci` here; developers get the browser once per machine
          # (it caches outside the repo) via `npx playwright install chromium`.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test

      # The Cloud Functions are a separate npm project that compiles ../src as
      # well as its own, so a change to aiShared.ts or limits.ts can break the
      # backend while the app still builds. Checked here; NOT deployed here —
      # `firebase deploy --only functions` is manual until the deploy service
      # account has the Cloud Functions and Secret Manager roles for it. That
      # means a client change depending on a new callable needs the functions
      # deployed first.
      - run: npm ci --prefix functions
      - run: npm run typecheck --prefix functions
      - run: npm test --prefix functions

      - run: npm run build
        env:
          # Firebase *client* config is public, not secret (the real Gemini key
          # lives server-side in the Firebase project) — so these are repo
          # Variables, not Secrets. Unset today: the app reads them through
          # isCloudAIConfigured() and simply keeps the AI features hidden, which
          # lets the Firebase AI branch merge without touching this workflow.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy to the live channel
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Name generated by `firebase init hosting:github` for this project.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COCKTAILS_C2705 }}
          projectId: cocktails-c2705
          channelId: live

      # Skipped for forked PRs, which can't read the service-account secret.
      - name: Deploy a preview channel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Name generated by `firebase init hosting:github` for this project.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COCKTAILS_C2705 }}
          projectId: cocktails-c2705
          expires: 7d
