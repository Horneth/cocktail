name: Deploy farewell page to GitHub Pages

# Manual only — never on push. The app itself deploys to Firebase Hosting now;
# GitHub Pages exists solely to keep serving a signpost (and a self-destroying
# service worker) to anyone still holding the old /cocktail/ install. Nothing
# here should ever redeploy automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the new site URL is still a placeholder
        run: |
          if grep -q 'REPLACE-ME' farewell/index.html; then
            echo "farewell/index.html still points at REPLACE-ME.web.app."
            echo "Set the real Firebase Hosting URL before publishing this page."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: farewell
      - id: deployment
        uses: actions/deploy-pages@v4
